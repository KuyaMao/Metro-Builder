/* main menu: everything scales with the screen (vmin), so phones, tablets and monitors keep the same proportions */
#menu{padding:max(12px,3vmin) max(12px,4vmin)}
#menu .mcard{width:min(94vw,clamp(300px,64vmin,620px));max-width:none;max-height:calc(100vh - 2*max(12px,3vmin));overflow:auto;padding:clamp(14px,3.6vmin,34px) clamp(14px,3.6vmin,34px) clamp(10px,2.4vmin,24px);border-radius:clamp(14px,2.6vmin,26px)}
#menu h1{font-size:clamp(30px,9vmin,80px);margin:0 0 clamp(4px,1vmin,10px)}
#menu p{font-size:clamp(13px,2.5vmin,20px);margin:0 0 clamp(10px,3vmin,28px)}
#menu button{min-height:clamp(50px,10vmin,80px);font-size:clamp(16px,3.1vmin,24px);margin:clamp(6px,1.5vmin,14px) 0;padding:clamp(6px,1.4vmin,14px) clamp(12px,2.8vmin,26px);border-radius:clamp(10px,1.8vmin,18px)}
#menu button small{font-size:clamp(11.5px,2.2vmin,17px);margin-top:2px}
@media (orientation:landscape) and (max-height:540px){
  #menu .mcard{width:min(94vw,clamp(560px,150vh,860px));display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(10px,3vh,22px);align-items:stretch;padding:clamp(10px,3vh,20px) clamp(14px,3vh,24px) clamp(8px,2vh,14px)}
  #menu .mcard h1,#menu .mcard p{grid-column:1/-1}#menu h1{font-size:clamp(26px,10vh,46px)}#menu p{font-size:clamp(12px,3.6vh,15px);margin-bottom:clamp(4px,2vh,12px)}
  #menu button{min-height:clamp(44px,15vh,64px);font-size:clamp(15px,4.8vh,19px);margin:clamp(3px,1.4vh,7px) 0}#menu button small{font-size:clamp(11px,3.4vh,13px)}
  #menu #mCont,#menu #mGfx{grid-column:1/-1}#menu #mGfx{min-height:clamp(36px,11vh,48px)}}
@media (orientation:portrait){#menu .mcard{width:min(92vw,560px)}}
#menu #mGfx{background:transparent;border-style:dashed;min-height:clamp(42px,8vmin,64px);font-size:clamp(14px,2.8vmin,20px)}#menu #mGfx small{display:inline;margin-left:8px}
#menu #mCont{background:var(--acc);color:#13201f;border-color:var(--acc)}#menu #mCont small{color:#3a3a2a}
@media (orientation:landscape) and (max-height:540px){.shead h2{font-size:19px}.shead .close{min-height:34px;padding:4px 12px}.shead .dtabs button{min-height:34px}.shead{padding-bottom:6px}}

</head>

<canvas id="c"></canvas>

<div id="top">
  <div class="stat"><b id="sMoney">$0</b><small id="sInc">+0/mo</small></div>
  <div class="stat"><b id="sPop">0</b><small>citizens</small></div>
  <div class="stat"><b id="sHap">–</b><small>happiness</small></div>

  <div class="stat"><b id="sDate">Jan Y1</b><small id="sMode">Sandbox</small></div>
  <span class="sp"></span>

  <div id="goal"></div>
</div>
<div id="bot">
  <div class="row" id="sub"></div>
  <div class="row" id="cats"></div>
</div>

<div id="toast"></div>
<div id="tip"></div>
<div id="legend"></div>
<div id="tut"><div class="tstep" id="tStep"></div><b id="tTitle"></b><p id="tText"></p><div class="trow"><button id="tSkip">Skip tutorial</button><button id="tNext" class="on">Next</button></div></div>

<div class="sheet" id="edit"></div>
<div class="sheet" id="bmenu"></div>

<div id="interior">
  <div id="ihead"><h2 id="ititle">Terminal layout</h2><button id="iAuto">Auto layout</button><button id="iClear">Empty</button><button id="iDone" class="on">Done</button></div>
  <div id="istats"></div>
  <div id="iwrap"><canvas id="icv"></canvas><div id="izoom"><button id="izIn" aria-label="Zoom in" title="Zoom in">+</button><button id="izOut" aria-label="Zoom out" title="Zoom out">−</button><button id="izFit" aria-label="Fit to screen" title="Fit"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="izLab" class="on" aria-label="Show labels" title="Labels">Aa</button></div></div>
  <div id="iact"></div>
  <div class="row" id="ipal"></div>
</div>

<div id="menu">
  <canvas id="mbg" aria-hidden="true"></canvas>
  <div class="mcard">
    <h1>Metro<span>Builder</span></h1>
    <p>Plan roads, zone districts and design every terminal from the inside.</p>
    <button id="mCont" style="display:none">Continue<small id="mContInfo"></small></button>
    <button id="mSand">Sandbox<small>Unlimited money, everything unlocked</small></button>
    <button id="mCareer">Career<small>Start small, grow to unlock services and transit</small></button>
    <button id="mGfx">Graphics: High<small>Switch to Low for older phones</small></button>
  </div>

function netFilter(list){return list.filter(t=>{if(!t)return false;if(tool==='buslane')return t.road&&!t.buslane;if(t.b||t.ref!=null)return false;
  if(tool==='rail')return !t.rail&&!t.runway;if(tool==='metroline')return !t.metro&&!t.runway;if(tool==='runway')return !t.runway&&!t.road&&!t.water&&!t.rail&&!t.metro;return false;});}
// which tiles a road drag would add, and which existing roads it would convert
function roadPlan(list){const rt=ROADTOOL[tool],sw=rt==='h'?'n':roadOpt.sw,bk=rt!=='h'&&roadOpt.bk,add=[],up=[];let cost=0;
  list=list.filter(Boolean);const a=list[0],b=list[list.length-1],axis=!a||a===b?15:a.x!==b.x?10:5;
  for(const t of list){if(t.road){if(list.length>1&&!(roadMask(t)&axis))continue; // crossing another road makes a junction, it does not convert it
if((t.rt||'s')!==rt||(t.sw||'b')!==sw||!!t.bk!==bk){up.push(t);cost+=Math.max(5,Math.round((roadCost(rt,sw,bk,t.water)-roadCost(t.rt||'s',t.sw||'b',t.bk,t.water)*.5)));}}
    else if(!t.b&&t.ref==null&&!t.runway){add.push(t);cost+=roadCost(rt,sw,bk,t.water);}}
  return{add,up,cost};}
function spend(c){if(G.mode==='sandbox')return true;if(G.money<c){toast('Not enough money');Snd.play('error');return false;}G.money-=c;return true;}
function commit(list){
  list=list.filter(Boolean);if(!list.length)return;
  if(NETCOST[tool]){const l=netFilter(list);if(!l.length){toast(tool==='buslane'?'Bus lanes go on roads':'Blocked here');Snd.play('error');return;}if(!spend(l.length*NETCOST[tool]))return;
    l.forEach(t=>{if(tool==='buslane')t.buslane=true;else{t[tool==='metroline'?'metro':tool]=true;t.tree=false;t.zone=null;}});l.forEach(redrawAround);dirty=true;netT=0;Snd.play('road');}
  else if(isRoadTool(tool)){const r=roadPlan(list);if(!r.add.length&&!r.up.length){toast('Already built');return;}if(!spend(r.cost))return;const rt=ROADTOOL[tool];
    for(const t of r.add){t.road=true;t.tree=false;t.zone=null;}for(const t of r.add.concat(r.up)){t.rt=rt;t.sw=rt==='h'?'n':roadOpt.sw;t.bk=rt!=='h'&&roadOpt.bk;if(rt==='h')t.buslane=false;}
    r.add.concat(r.up).forEach(redrawAround);dirty=true;Snd.play('road');if(r.up.length&&!r.add.length)toast(r.up.length+' road tile'+(r.up.length>1?'s':'')+' upgraded');}
  else if(tool==='bulldoze'||tool==='demB'||tool==='demR')demolish(list,tool);
  else if(tool==='unzone'){list.forEach(t=>{if(t.zone&&!t.b){t.zone=null;drawTile(t);}});}
  else {const l=list.filter(t=>!t.road&&!t.water&&!t.b&&t.ref==null&&!t.rail&&!t.metro&&!t.runway&&t.zone!==tool);if(!l.length||!spend(l.length*5))return;l.forEach(t=>{t.zone=tool;t.tree=false;drawTile(t);});Snd.play('zone');}
  updateHUD();
}
function placeService(t){
  const s=SERV[tool],sz=s.size;const list=[];
  for(let dz=0;dz<sz;dz++)for(let dx=0;dx<sz;dx++){const n=T(t.x+dx,t.z+dz);if(!n||n.road||n.water||n.b||n.ref!=null||n.rail||n.metro||n.runway){toast('Needs clear land');Snd.play('error');return;}list.push(n);}
  if(!spend(s.cost))return;
  const b={kind:tool,size:sz,name:s.name,rot:ghostRot,floors:1};
  if(s.cat==='tr'){b.layout=autoLayout(tool);}
  list.forEach(n=>n.zone=null);
  placeBuilding(t,b);Snd.play('build');toast(s.name+' built'+(s.cat==='tr'?' · tap it to design the layout':''));updateHUD();
}

/* ---------- demolish + undo ---------- */
let undoSnap=null;
function demolish(list,mode){
  const snap={roads:[],blds:[],trees:[],zones:[],nets:[],cost:0};const seen=new Set();
  for(let t of list){
    const isB=t.b||t.ref!=null;
    if(isB&&mode!=='demR'){const r=t.ref!=null?G.tiles[t.ref]:t;if(seen.has(r))continue;seen.add(r);snap.blds.push({t:r,b:JSON.parse(JSON.stringify(r.b))});removeBuilding(r);snap.cost+=50;}
    else if((t.rail||t.metro||t.runway||t.buslane)&&mode!=='demB'){snap.nets.push({t,f:[t.rail,t.metro,t.runway,t.buslane]});t.rail=t.metro=t.runway=t.buslane=false;redrawAround(t);netT=0;snap.cost+=5;}
    else if(t.road&&mode!=='demB'){snap.roads.push(t);t.road=false;redrawAround(t);snap.cost+=5;}
    else if(mode==='bulldoze'&&t.tree){snap.trees.push(t);t.tree=false;setTree(t);snap.cost+=2;}
    else if(mode==='bulldoze'&&t.zone&&!t.b){snap.zones.push({t,z:t.zone});t.zone=null;drawTile(t);}
  }
  if(!snap.roads.length&&!snap.blds.length&&!snap.trees.length&&!snap.zones.length&&!snap.nets.length){toast(mode==='demR'?'No road there':mode==='demB'?'No building there':'Nothing to demolish');return;}
  if(G.mode==='career')G.money-=snap.cost;Snd.play('demolish');
  undoSnap=snap;dirty=true;
  const n=[];if(snap.blds.length)n.push(snap.blds.length+' building'+(snap.blds.length>1?'s':''));if(snap.roads.length)n.push(snap.roads.length+' road tile'+(snap.roads.length>1?'s':''));if(snap.nets.length)n.push(snap.nets.length+' track/lane tile'+(snap.nets.length>1?'s':''));if(snap.trees.length)n.push(snap.trees.length+' tree'+(snap.trees.length>1?'s':''));
  toast('Demolished '+(n.join(', ')||'zoning')+' · tap Undo to restore');renderCats();updateHUD();
}
function undoDemolish(){
  const s=undoSnap;if(!s){toast('Nothing to undo');return;}
  s.roads.forEach(t=>{if(!t.b&&t.ref==null){t.road=true;t.tree=false;}});s.roads.forEach(redrawAround);
  (s.nets||[]).forEach(({t,f})=>{if(!t.b&&t.ref==null){[t.rail,t.metro,t.runway,t.buslane]=f;redrawAround(t);}});netT=0;
  s.zones.forEach(({t,z})=>{if(!t.b&&!t.road){t.zone=z;drawTile(t);}});
  s.trees.forEach(t=>{if(!t.b&&!t.road&&t.ref==null){t.tree=true;setTree(t);}});
  for(const{t,b}of s.blds){let ok=true;for(let dz=0;dz<LZ(b);dz++)for(let dx=0;dx<LX(b);dx++){const n=T(t.x+dx,t.z+dz);if(!n||n.road||n.b||n.ref!=null)ok=false;}if(ok)placeBuilding(t,b);}
  if(G.mode==='career')G.money+=s.cost;
  undoSnap=null;dirty=true;toast('Restored');renderCats();updateHUD();
}

/* ---------- editor sheet ---------- */
const sheet=$('edit');let selT=null;
// every sheet gets a fixed header (title, Close, designer tabs) and a scrolling body, so Close never scrolls away
{let lastKey='',lastTop=0;const frame=()=>{const c=sheet.firstElementChild;if(!c||!c.classList.contains('close')||sheet.querySelector(':scope>.sbody'))return;
  const head=document.createElement('div'),body=document.createElement('div');head.className='shead';body.className='sbody';
  const h2=sheet.querySelector(':scope>h2'),tabs=sheet.querySelector(':scope>.dtabs');if(h2)head.appendChild(h2);head.appendChild(c);if(tabs)head.appendChild(tabs);
  while(sheet.firstChild)body.appendChild(sheet.firstChild);sheet.appendChild(head);sheet.appendChild(body);
  const k=(h2?h2.textContent:'')+'|'+(tabs?(tabs.querySelector('.on')||{}).textContent:'');if(k===lastKey)body.scrollTop=lastTop;else lastTop=0;lastKey=k;
  body.addEventListener('scroll',()=>{lastTop=body.scrollTop;},{passive:true});};
  new MutationObserver(frame).observe(sheet,{childList:true});}
function selectTile(t){
  if(t.ref!=null)t=G.tiles[t.ref];
  if(!t.b){
    if(t.road){selT=null;roadSheet(t);return;}
    if(t.zone&&t.ref==null&&!t.road&&!t.rail&&!t.runway){selT=null;lotSheet(t);return;}
    if(tool==='select')toast(t.water?'River':'Empty land');return;}
  if(selT!==t)desOpen=false;selT=t;renderSheet();sheet.classList.add('open');bmenu.classList.remove('open');
}
function lotSheet(t){const z=t.zone,c=[0,2500,4000,6000][1]*(z==='C'?1.2:z==='I'?1.1:1),nm={R:'Residential',C:'Commercial',I:'Industrial'}[z];
  sheet.innerHTML=`<button class="close" id="eClose">Close</button><h2>Empty ${nm.toLowerCase()} lot</h2><p style="color:var(--mute);margin:0 0 10px">Buildings grow here on their own when there is demand, power, water and a road. You can also design one yourself.</p>
  <button id="lDes" class="on" style="width:100%;font-weight:700">Design a building here${G.mode==='sandbox'?'':' · '+fmt(c)}</button>`;
  sheet.classList.add('open');bmenu.classList.remove('open');$('eClose').onclick=()=>sheet.classList.remove('open');
  $('lDes').onclick=()=>{if(!hasRoad(t)){toast('Needs a road next to the lot');return;}if(!spend(c))return;const b=Object.assign({zone:z,level:1,size:1,rot:faceRoad(t)},defaultBuilding(z,1));b.d=designFrom(b);b.des=true;b.custom=true;placeBuilding(t,b,true);selT=t;desOpen=true;desTab='shape';focusOn(t);renderSheet();sheet.classList.add('open');Snd.play('zone');};}
// a straight run of road tiles through t (continues across junctions, stops at turns and ends)
function streetOf(t){const m=roadMask(t),ax=(m&10)&&!(m&5)?[1,0]:(m&5)&&!(m&10)?[0,1]:null;if(!ax)return[t];const out=[t];
  for(const sg of[-1,1]){let cur=t;for(let i=0;i<N;i++){const bit=ax[0]?(sg>0?2:8):(sg>0?4:1);if(!(roadMask(cur)&bit))break;cur=T(cur.x+ax[0]*sg,cur.z+ax[1]*sg);if(!cur||out.includes(cur))break;out.push(cur);}}
  return out;}
let roadSel={all:true};

  const apply=(rt,sw,bk)=>{const c=price(rt,sw,bk);if(!c&&list.every(n=>(n.rt||'s')===rt&&(n.sw||'b')===sw&&!!n.bk===bk))return;if(!spend(c))return;
    for(const n of list){n.rt=rt;n.sw=rt==='h'?'n':sw;n.bk=rt!=='h'&&bk;if(rt==='h')n.buslane=false;}list.forEach(redrawAround);dirty=true;Snd.play('road');updateHUD();roadSheet(t);};
  sheet.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{const k=b.dataset.rt;apply(k,k==='h'?'n':(t.sw&&t.sw!=='n'?t.sw:'b'),k!=='h'&&!!t.bk);});
  sheet.querySelectorAll('[data-rsw]').forEach(b=>b.onclick=()=>apply(rtK,b.dataset.rsw,!!t.bk));
  sheet.querySelectorAll('[data-rbk]').forEach(b=>b.onclick=()=>apply(rtK,t.sw||'b',b.dataset.rbk==='1'));
  $('dRoad').onclick=()=>{demolish(list,'demR');sheet.classList.remove('open');};
}

const Snd=(()=>{
  let ctx=null,master,music,sfx,amb,noiseBuf,ambSrc,ambF,ambG,birdsT=0,musicT=0,chord=0,started=false;
  const vol=(()=>{try{return JSON.parse(localStorage.getItem('metrob_vol'))||{m:.8,mu:.35,s:.7};}catch(e){return{m:.8,mu:.35,s:.7};}})();
  function save(){try{localStorage.setItem('metrob_vol',JSON.stringify(vol));}catch(e){}}
  function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{ctx=new AC();}catch(e){return;}
    master=ctx.createGain();master.connect(ctx.destination);music=ctx.createGain();sfx=ctx.createGain();amb=ctx.createGain();music.connect(master);sfx.connect(master);amb.connect(master);apply();
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuf.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
    ambSrc=ctx.createBufferSource();ambSrc.buffer=noiseBuf;ambSrc.loop=true;ambF=ctx.createBiquadFilter();ambF.type='lowpass';ambF.frequency.value=500;ambG=ctx.createGain();ambG.gain.value=0;ambSrc.connect(ambF);ambF.connect(ambG);ambG.connect(amb);ambSrc.start();started=true;}
  function apply(){if(!ctx)return;master.gain.value=vol.m;music.gain.value=vol.mu*.5;sfx.gain.value=vol.s;amb.gain.value=vol.s*.9;}
  function unlock(){init();if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});}
  function env(node,t,a,peak,dec){node.gain.setValueAtTime(0,t);node.gain.linearRampToValueAtTime(peak,t+a);node.gain.exponentialRampToValueAtTime(.0001,t+a+dec);}
  function tone(freq,type,dur,peak,dest,when=0,glide){if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);o.connect(g);g.connect(dest||sfx);env(g,t,.008,peak,dur);o.start(t);o.stop(t+dur+.05);}
  function noise(dur,peak,fq,type='bandpass',when=0,q=1){if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime+when,s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=fq;f.Q.value=q;s.connect(f);f.connect(g);g.connect(sfx);env(g,t,.005,peak,dur);s.start(t,Math.random());s.stop(t+dur+.05);}
  const fx={
    click:()=>tone(880,'triangle',.05,.06),
    build:()=>{noise(.12,.25,320,'lowpass');tone(180,'sine',.14,.18,null,0,90);},
    road:()=>{noise(.18,.18,900,'bandpass',0,.7);tone(140,'sine',.1,.1);},
    zone:()=>{tone(660,'sine',.08,.07);tone(990,'sine',.1,.05,null,.05);},
    demolish:()=>{noise(.35,.35,250,'lowpass');noise(.25,.2,1600,'bandpass',.05,.8);tone(90,'sawtooth',.2,.06,null,0,45);},
    error:()=>{tone(180,'square',.12,.05);tone(140,'square',.14,.05,null,.12);},
    milestone:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,'triangle',.35,.12,null,i*.11));},
    chime:()=>{tone(784,'sine',.25,.09);tone(1175,'sine',.35,.06,null,.08);},
    horn:()=>{tone(392,'square',.18,.025);tone(494,'square',.18,.02);},

  // background music: slow generative pad

function exitBuild(){const was=tool;cat='view';tool='view';clearPreview();bmenu.classList.remove('open');renderCats();if(was&&was!=='view')toast('Building mode off');}
function setTool(c,t){if(t!==tool)clearPreview();cat=c;tool=t;bmenu.classList.remove('open');renderCats();}
addEventListener('keydown',e=>{
  if(typing(e)||!G||!$('menu').classList.contains('hide'))return;
  const k=e.key.toLowerCase();keys.add(k);
  if(e.ctrlKey&&k==='z'){undoDemolish();e.preventDefault();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  switch(k){
    case 'q':if(!e.repeat)rotBy(Math.PI/12);break;case 'e':if(!e.repeat)rotBy(-Math.PI/12);break;
    case ' ':setSpeed(speed?0:lastSpeed);e.preventDefault();break;
    case '1':case '2':case '3':case '4':setSpeed(+k);break;
    case 'v':case 'g':setTool('view','view');clearPreview();break;
    case 'b':openBuild();break;case 'x':setTool('demolish','bulldoze');break;case 'm':cycleMap();break;
    case 'escape':if($('interior').classList.contains('open'))$('iDone').click();else if(sheet.classList.contains('open')||bmenu.classList.contains('open')){sheet.classList.remove('open');bmenu.classList.remove('open');}else{setTool('view','view');clearPreview();}break;
    case 'f11':break;
  }
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
function keyCam(dt){if(!keys.size)return;const sp=cam.dist*1.1*dt;let dx=0,dz=0;
  if(keys.has('w')||keys.has('arrowup'))dz-=1;if(keys.has('s')||keys.has('arrowdown'))dz+=1;if(keys.has('a')||keys.has('arrowleft'))dx-=1;if(keys.has('d')||keys.has('arrowright'))dx+=1;
  if(dx||dz){const c=Math.cos(cam.yaw),s=Math.sin(cam.yaw);cam.tx+=(dx*c+dz*s)*sp;cam.tz+=(-dx*s+dz*c)*sp;if(follow)follow=null;}
  if(keys.has('q'))rotBy(dt*.7);if(keys.has('e'))rotBy(-dt*.7);
  if(keys.has('r'))cam.pitch+=dt*.9;if(keys.has('f'))cam.pitch-=dt*.9;
  if(keys.has('=')||keys.has('+'))cam.dist*=1-dt*1.5;if(keys.has('-')||keys.has('_'))cam.dist*=1+dt*1.5;}

const OVL=[null,'power','water','services','happiness','pollution','transit'];
const OVN={power:['Power','Covered','No power'],water:['Water','Covered','No water'],services:['Services','All 5','None'],happiness:['Happiness','Happy','Unhappy'],pollution:['Pollution','Polluted',''],transit:['Transit','Served','']};

const ovMesh=new THREE.InstancedMesh(new THREE.PlaneGeometry(.94,.94).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({transparent:true,opacity:.55,depthWrite:false}),N*N);
ovMesh.renderOrder=3;ovMesh.frustumCulled=false;ovMesh.visible=false;scene.add(ovMesh);
const _oc=new THREE.Color(),OK_C=new THREE.Color(0x3ddc84),BAD_C=new THREE.Color(0xff5252),MID_C=new THREE.Color(0xffd23f);
function updateOverlay(){
  const mode=OVL[ovI];ovMesh.visible=!!mode&&!!G;$('legend').style.top=($('top').offsetHeight+6)+'px';$('legend').classList.toggle('show',!!mode&&!!G);{const mb=document.querySelector('[data-c=map]');if(mb)mb.classList.toggle('on',!!mode);}
  if(!mode||!G)return;if(dirty||!cov)computeCoverage();
  const n=OVN[mode];$('legend').innerHTML=`<b>${n[0]}</b><span><i style="background:#3ddc84"></i>${n[1]}</span>${n[2]?`<span><i style="background:#ff5252"></i>${n[2]}</span>`:''}`;
  if(mode==='pollution')$('legend').innerHTML=`<b>Pollution</b><span><i style="background:#a0522d"></i>Polluted area</span>`;
  if(mode==='transit')$('legend').innerHTML=`<b>Transit</b><span><i style="background:#4fb3ff"></i>Near an open station</span>`;
  for(const t of G.tiles){const i=key(t),v=cov[i],r=t.ref!=null?G.tiles[t.ref]:t;let show=!t.water,c=null;
    if(mode==='power'||mode==='water'){c=v[mode]?OK_C:BAD_C;if(!t.zone&&!t.b&&t.ref==null&&!t.road&&!v[mode])show=false;}
    else if(mode==='services'){const k=['police','fire','health','edu','park'].filter(q=>v[q]).length;c=_oc.copy(BAD_C).lerp(MID_C,Math.min(1,k/2.5)).lerp(OK_C,Math.max(0,(k-2.5)/2.5)).clone();if(!t.zone&&!t.b&&t.ref==null)show=false;}
    else if(mode==='happiness'){if(r.b&&r.b.zone&&r.b.hap!=null){const h=r.b.hap/100;c=_oc.copy(BAD_C).lerp(MID_C,Math.min(1,h*2)).lerp(OK_C,Math.max(0,h*2-1)).clone();}else show=false;}
    else if(mode==='pollution'){if(v.poll)c=new THREE.Color(0xa0522d);else show=false;}

  ovMesh.instanceMatrix.needsUpdate=true;if(ovMesh.instanceColor)ovMesh.instanceColor.needsUpdate=true;
}
