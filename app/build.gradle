plugins { id 'com.android.application' }
android {
    namespace 'com.metrobuilder.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.metrobuilder.game'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable test build; use your own key for Play Store
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'html' }
}
