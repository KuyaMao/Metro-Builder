name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Assemble game (offline, three.js inlined)
        run: python3 tools/build_game.py
      - name: Build APK
        run: gradle assembleRelease --no-daemon
      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/MetroBuilder.apk
          cp MetroBuilder-PC.html out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: MetroBuilder, path: out/ }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Metro Builder (build ${{ github.run_number }})
          body: |
            Download **MetroBuilder.apk** on your Android phone, open it, and allow installing from your browser when asked.
            **MetroBuilder-PC.html** runs on Windows/Mac: download and double-click to play offline.
          files: |
            out/MetroBuilder.apk
            out/MetroBuilder-PC.html
