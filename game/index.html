<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Metro Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm city-planning console, glanceable on a phone
   IDEA: the municipal planning desk – a live 3D map with a transit-signage toolbar
   PICTURE: the city itself, full screen
   COLOUR and TYPE: deep teal glass panels, white text, signal yellow accent; Barlow Semi Condensed
   LAYOUT: stats strip on top, tool belt at bottom, slide-up editor sheets */
:root{--panel:rgba(10,32,38,.88);--ink:#f2f7f6;--mute:#9fb8b5;--acc:#ffd23f;--bad:#ff6f59;--good:#7ee081}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1f24;color:var(--ink);font:15px/1.4 "Barlow Semi Condensed",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer}
button.on{background:var(--acc);color:#13201f;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--panel);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.1;padding:0 6px}
.stat b{font-size:17px;white-space:nowrap}.stat small{color:var(--mute);font-size:12px}
.dem{display:flex;gap:4px;align-items:flex-end;height:40px;min-height:40px;padding:2px 6px;background:none;border:0}
.dem span{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dem i{width:10px;border-radius:2px 2px 0 0;display:block;transition:height .4s}.dem em{font-style:normal;font-size:10px;color:var(--mute);line-height:1;margin-top:1px}
#legend{position:fixed;left:8px;top:calc(96px + env(safe-area-inset-top));background:var(--panel);border-radius:10px;padding:6px 10px;font-size:13px;z-index:4;display:none;max-width:60vw}
#legend.show{display:block}#legend b{display:block;font-size:15px}#legend span{display:inline-flex;align-items:center;gap:4px;margin-right:8px}#legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
#tut{position:fixed;left:8px;right:62px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;background:#103a40;border:1px solid var(--acc);border-radius:14px;padding:12px 14px;z-index:8;display:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#tut.show{display:block}#tut b{font-size:18px;display:block}#tut p{margin:4px 0 8px;color:#d8e6e4}.tstep{font-size:12px;color:var(--acc)}.trow{display:flex;gap:8px;justify-content:flex-end}
.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,210,63,.55)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;outline:2px solid var(--acc)}}
#top .sp{flex:1}
#top button{min-height:36px;padding:0 9px}
#goal{flex-basis:100%;font-size:13px;color:var(--mute);padding:0 6px}#goal b{color:var(--acc)}
#goal:empty{display:none}
#bot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);backdrop-filter:blur(8px);z-index:5;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.row::-webkit-scrollbar{display:none}
.row button{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;font-size:13px;line-height:1.1;padding:4px 8px}
.row button small{color:var(--mute);font-size:11px}.row button.on small{color:#13201f}
#sub{margin-bottom:6px}#sub:empty{display:none}
.chip{display:flex;gap:10px;align-items:center;width:100%;padding:2px}.chip small{color:var(--mute)}.chip button{flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px;min-height:76px}
.card b{display:block;font-size:16px}.card small{display:block;color:var(--mute);font-size:13px}.card small.d{color:#c9d8d6;margin-top:2px}
.card.on{background:rgba(255,210,63,.18);color:var(--ink);border-color:var(--acc)}
#bmenu{max-height:70vh}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-bottom:2px}
#cam{position:fixed;right:8px;bottom:calc(130px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:4}
#cam button{width:44px;padding:0;background:var(--panel)}#cam button.on{background:var(--acc);color:#13201f}
#toast{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:10px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90vw}
#toast.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:#0f2a30;border-radius:16px 16px 0 0;z-index:10;padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;touch-action:pan-y;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.sheet.open{transform:none}.sheet:not(.open){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.sheet h2{margin:0 0 8px;font-size:24px;line-height:1.05}
.sheet label{display:block;color:var(--mute);font-size:13px;margin:10px 0 4px}
.sheet input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--ink)}
.sheet input[type=range]{width:100%;height:32px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px}
.swatch{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid transparent}
.swatch.on{border-color:var(--acc)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:8px 0}
.kv div{background:rgba(255,255,255,.05);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-size:18px}.kv small{color:var(--mute)}
.vol{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}.vol span{color:var(--mute);font-size:14px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute)}kbd{font:inherit;font-size:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:1px 5px;color:var(--ink);margin-right:2px}
@media (min-width:900px){.sheet{left:12px;right:auto;width:460px;bottom:84px;border-radius:16px;max-height:calc(100vh - 200px)}#bot .row#cats{max-width:720px;margin:0 auto}#sub{max-width:900px;margin:0 auto 6px}#tut{left:12px;right:auto;margin:0;bottom:96px}}
.close{position:sticky;top:0;float:right;min-height:40px}
#interior{position:fixed;inset:0;background:#0b1f24;z-index:20;display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));touch-action:manipulation}
#interior.open{display:flex}
#ihead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ihead h2{margin:0;font-size:22px;flex:1}
#igrid{flex:1;display:grid;gap:3px;margin:10px 0;align-content:center;background:#1c3b40;padding:6px;border-radius:12px;background-image:linear-gradient(#24474d 1px,transparent 1px),linear-gradient(90deg,#24474d 1px,transparent 1px);background-size:20px 20px}
#igrid div{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-align:center;line-height:1;color:#13201f;overflow:hidden;cursor:pointer}
#istats{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
#istats b{color:var(--acc)}
#menu{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1d5560,#071417 75%);padding:20px}
#menu .mcard{max-width:420px;width:100%;text-align:center}
#menu h1{font-size:52px;line-height:1;margin:0 0 6px;letter-spacing:-.5px}
#menu h1 span{color:var(--acc)}
#menu p{color:var(--mute);margin:0 0 22px}
#menu button{display:block;width:100%;margin:10px 0;min-height:56px;font-size:19px;font-weight:600;text-align:left;padding:8px 16px}
#menu button small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
#menu button.on small{color:#13201f}
#menu.hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div class="stat"><b id="sMoney">$0</b><small id="sInc">+0/mo</small></div>
  <div class="stat"><b id="sPop">0</b><small>citizens</small></div>
  <div class="stat"><b id="sHap">–</b><small>happiness</small></div>
  <button class="dem" id="bDem" aria-label="Demand for homes, shops and industry"><span><i id="dR" style="background:#7ee081"></i><em>R</em></span><span><i id="dC" style="background:#4fb3ff"></i><em>C</em></span><span><i id="dI" style="background:#ffc04d"></i><em>I</em></span></button>
  <div class="stat"><b id="sDate">Jan Y1</b><small id="sMode">Sandbox</small></div>
  <span class="sp"></span>
  <button id="bSpeed">1×</button>
  <button id="bMenu">Menu</button>
  <div id="goal"></div>
</div>
<div id="cam">
  <button id="cMap" aria-label="Map overlays" style="font-size:12px">Map</button>
  <button id="cRotL" aria-label="Rotate left">⟲</button>
  <button id="cRotR" aria-label="Rotate right">⟳</button>
  <button id="cTilt" aria-label="Tilt camera">Tilt</button>
  <button id="cFollow" aria-label="Follow a car" style="font-size:12px">Car</button>
  <button id="cPed" aria-label="Follow a person" style="font-size:12px">Tao</button>
</div>
<div id="bot">
  <div class="row" id="sub"></div>
  <div class="row" id="cats"></div>
</div>
<div id="toast"></div>
<div id="legend"></div>
<div id="tut"><div class="tstep" id="tStep"></div><b id="tTitle"></b><p id="tText"></p><div class="trow"><button id="tSkip">Skip tutorial</button><button id="tNext" class="on">Next</button></div></div>

<div class="sheet" id="edit"></div>
<div class="sheet" id="bmenu"></div>

<div id="interior">
  <div id="ihead"><h2 id="ititle">Terminal interior</h2><button id="iAuto">Auto layout</button><button id="iClear">Clear</button><button id="iDone" class="on">Done</button></div>
  <div id="istats"></div>
  <div id="igrid"></div>
  <div class="row" id="ipal"></div>
</div>

<div id="menu">
  <div class="mcard">
    <h1>Metro<span>Builder</span></h1>
    <p>Plan roads, zone districts and design every terminal from the inside.</p>
    <button id="mCont" style="display:none">Continue<small id="mContInfo"></small></button>
    <button id="mSand">Sandbox<small>Unlimited money, everything unlocked</small></button>
    <button id="mCareer">Career<small>Start small, grow to unlock services and transit</small></button>
    <button id="mGfx">Graphics: High<small>Switch to Low for older phones</small></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const N = 48, FLOOR = 0.13;
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (a,b)=>a+Math.random()*(b-a);
const fmt = n => (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- catalogue ---------- */
const SERV = {
  park:{name:'Park',cost:300,up:10,size:1,r:5,cov:'park',col:0x5bbf5b,cat:'svc'},
  power:{name:'Power plant',cost:8000,up:160,size:2,r:16,cov:'power',col:0xc9c3b8,cat:'svc',poll:5},
  solar:{name:'Solar farm',cost:12000,up:120,size:2,r:12,cov:'power',col:0x2f4d7a,cat:'svc'},
  water:{name:'Water tower',cost:3000,up:60,size:1,r:11,cov:'water',col:0xd8dde2,cat:'svc'},
  police:{name:'Police',cost:2500,up:80,size:1,r:9,cov:'police',col:0x3c64c8,cat:'svc'},
  fire:{name:'Fire station',cost:2500,up:80,size:1,r:9,cov:'fire',col:0xc8423c,cat:'svc'},
  school:{name:'School',cost:4000,up:120,size:2,r:10,cov:'edu',col:0xe8c35a,cat:'svc'},
  hospital:{name:'Hospital',cost:6000,up:180,size:2,r:12,cov:'health',col:0xf2f2f2,cat:'svc'},
  bus:{name:'Bus terminal',cost:5000,up:120,size:2,r:9,cov:'transit',col:0x2a9d8f,cat:'tr',gw:8,gh:6,plat:'Bus bay',capPer:350},
  metro:{name:'Metro station',cost:9000,up:200,size:1,r:8,cov:'transit',col:0x8d5bd6,cat:'tr',gw:7,gh:5,plat:'Metro platform',capPer:900},
  train:{name:'Train station',cost:15000,up:300,size:3,r:13,cov:'transit',col:0x9c6644,cat:'tr',gw:11,gh:7,plat:'Rail platform',capPer:1200},
  airport:{name:'Airport',cost:40000,up:900,size:4,r:20,cov:'transit',col:0xb0bec5,cat:'tr',gw:13,gh:8,plat:'Boarding gate',capPer:1500},
};
const ITEMS = [
  {id:'plat',label:'Platform',col:'#ffd23f',cost:400},
  {id:'ent',label:'Entrance',col:'#7ee081',cost:150},
  {id:'tick',label:'Tickets',col:'#4fb3ff',cost:200},
  {id:'sec',label:'Security',col:'#ff9f59',cost:250},
  {id:'gate',label:'Fare gate',col:'#c3a6ff',cost:150},
  {id:'seat',label:'Seating',col:'#b8d8d3',cost:60},
  {id:'shop',label:'Shop',col:'#ff7aa8',cost:300},
  {id:'food',label:'Food',col:'#ffb3c7',cost:300},
  {id:'wc',label:'Restroom',col:'#9fd4ff',cost:180},
  {id:'info',label:'Info board',col:'#e6f5c8',cost:80},
  {id:'esc',label:'Escalator',col:'#d6c9b4',cost:350},
  {id:'plant',label:'Plants',col:'#5bbf5b',cost:40},
];
const ITEM = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const MILESTONES = [
  {pop:0,name:'Hamlet',unlock:['road','R','power','water','park','bulldoze','select','view']},
  {pop:120,name:'Village',unlock:['C','I','police','bus'],reward:8000},
  {pop:500,name:'Town',unlock:['fire','school','metro'],reward:15000},
  {pop:1500,name:'City',unlock:['hospital','train','solar'],reward:30000},
  {pop:4000,name:'Big City',unlock:['airport'],reward:60000},
  {pop:10000,name:'Metropolis',unlock:[],reward:150000},
];
const COLORS = ['#e9e4d8','#c9b79c','#b5524a','#4f6d8a','#8fb8c9','#6e8f63','#e0b450','#5a5a66'];

/* ---------- state ---------- */
let G = null; // game state
function newGame(mode){
  G = {mode, money: mode==='sandbox'?1e9:60000, day:0, tax:10, tiles:[], unlocked:new Set(), ms:0, seed:Math.random()};
  for(let z=0;z<N;z++)for(let x=0;x<N;x++){
    const rx = N*0.78 + Math.sin(z*0.16)*3.5;
    const water = Math.abs(x-rx)<2.2;
    G.tiles.push({x,z,water,road:false,zone:null,b:null,tree:!water && Math.random()<(0.18+0.25*Math.max(0,Math.sin(x*0.3+z*0.2))),ref:null});
  }
  // starter highway
  for(let x=0;x<N;x++){const t=T(x,Math.floor(N/2));t.road=true;t.tree=false;}
  if(mode==='sandbox') Object.keys(SERV).concat(['road','R','C','I','bulldoze','select','view']).forEach(k=>G.unlocked.add(k));
  else MILESTONES[0].unlock.forEach(k=>G.unlocked.add(k));
}
const T = (x,z)=> (x<0||z<0||x>=N||z>=N)?null:G.tiles[z*N+x];
const wx = x => x - N/2 + 0.5;

/* ---------- three setup ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbcd8e6, 45, 110);
const camera = new THREE.PerspectiveCamera(45,1,0.1,300);
const hemi = new THREE.HemisphereLight(0xdff1ff,0x5a6b45,0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6,1.0);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:120});
sun.shadow.bias=-0.0006;
scene.add(sun); scene.add(sun.target);

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}return t;}
// ground
const grassTex = canvasTex(256,256,(g,w,h)=>{g.fillStyle='#6f9b4d';g.fillRect(0,0,w,h);for(let i=0;i<5000;i++){g.fillStyle=`hsla(${80+Math.random()*30},${35+Math.random()*20}%,${30+Math.random()*20}%,.35)`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}},true);
grassTex.repeat.set(N/4,N/4);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(N+40,N+40), new THREE.MeshStandardMaterial({color:0x7aa35a,map:grassTex,roughness:1}));
grassTex.repeat.set((N+40)/4,(N+40)/4);
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const tileGeo = new THREE.PlaneGeometry(1,1); tileGeo.rotateX(-Math.PI/2);
const boxGeo = new THREE.BoxGeometry(1,1,1); boxGeo.translate(0,0.5,0);
const cylGeo = new THREE.CylinderGeometry(0.5,0.5,1,16); cylGeo.translate(0,0.5,0);
const roofGeo = new THREE.ConeGeometry(0.72,1,4); roofGeo.rotateY(Math.PI/4); roofGeo.translate(0,0.5,0);
const M = {}; const mat = (k,o)=> M[k]||(M[k]=new THREE.MeshStandardMaterial(o));

// water instanced
let waterMesh;
// trees: two species, instanced, merged trunk + canopy (leaf colour per instance)
const TREEG_R=mergeG([[new THREE.CylinderGeometry(.03,.045,.3,6).translate(0,.15,0),0x6b4a2f],[new THREE.IcosahedronGeometry(.2,1).translate(0,.42,0),0xffffff],[new THREE.IcosahedronGeometry(.15,0).translate(.11,.36,.06),0xffffff],[new THREE.IcosahedronGeometry(.15,0).translate(-.1,.38,-.06),0xffffff],[new THREE.IcosahedronGeometry(.13,0).translate(0,.55,.02),0xffffff]]);
const TREEG_P=mergeG([[new THREE.CylinderGeometry(.025,.04,.22,6).translate(0,.11,0),0x5d4030],[new THREE.ConeGeometry(.24,.32,8).translate(0,.3,0),0xffffff],[new THREE.ConeGeometry(.19,.28,8).translate(0,.46,0),0xffffff],[new THREE.ConeGeometry(.13,.24,8).translate(0,.6,0),0xffffff]]);
const treeMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.9,flatShading:true});
const treeCrown=new THREE.InstancedMesh(TREEG_R,treeMat,N*N),treeTrunk=new THREE.InstancedMesh(TREEG_P,treeMat,N*N);
treeCrown.castShadow=treeTrunk.castShadow=true;treeCrown.receiveShadow=treeTrunk.receiveShadow=true;scene.add(treeCrown,treeTrunk);
const LEAF=[0x4f8f3c,0x3f7a35,0x5c9a42,0x6aa84f,0x3b6e3a,0x7aa64a,0x4a8550];
for(let i=0;i<N*N;i++){const c=new THREE.Color(LEAF[(i*7+Math.floor(i/N)*3)%LEAF.length]).offsetHSL(0,0,((i*13)%9-4)/100).convertSRGBToLinear();treeCrown.setColorAt(i,c);treeTrunk.setColorAt(i,c.clone().offsetHSL(.02,0,-.06));}
const dummy = new THREE.Object3D();
let treeDirty=true;
function setTree(t){treeDirty=true;}
function rebuildTrees(){treeDirty=false;if(!G)return;let nr=0,np=0;const cc=new THREE.Color();
  for(const t of G.tiles){if(!(t.tree&&!t.road&&!t.b&&t.ref==null&&!t.zone))continue;const pine=((t.x*7+t.z*13)%5)<2,i=t.z*N+t.x;

    const pad=box(g,sz*.98,.03,sz*.98,mat('pave',{color:0xb8b2a6}),0,0,0);pad.castShadow=false;

      case 'solar': for(let i=0;i<4;i++)for(let j=0;j<3;j++){const p=box(g,.38,.03,.5,mat('pv',{color:0x223a66,metalness:.6,roughness:.25}),-.6+i*.4,.15,-.55+j*.55);p.rotation.x=-.4;}box(g,.3,.25,.3,mat('inv',{color:0xe0e0e0}),.7,0,.7);break;

      case 'school': box(g,S*.55,.3*fl+.1,S*.8,m1,-S*.2,0,0);box(g,S*.35,.02,S*.7,mat('field',{color:0x58a55a}),S*.28,0,0);break;

      default: box(g,S*.8,.35*fl,S*.8,m1);box(g,S*.85,.05,S*.85,mat('trim'+b.kind,{color:c.clone().offsetHSL(0,0,-.2)}),0,.35*fl);
        cyl(g,.03,.4,mat('pole',{color:0x666666}),S*.3,.35*fl,S*.3);box(g,.18,.1,.01,mat('flag'+b.kind,{color:0xffffff}),S*.3+.09,.35*fl+.28,S*.3);
    }

    box(g,.2,.9,.2,m1,S*.38,0,-S*.3);box(g,.21,.12,.21,mat('clock',{color:0xffffff,emissive:0xffffaa,emissiveIntensity:.3}),S*.38,.7,-S*.3);

    cyl(g,.1,1.1,m1,S*.4,0,S*.05);box(g,.36,.18,.36,glass,S*.4,1.1,S*.05);
    const n=Math.min(plats,5);for(let i=0;i<n;i++){const pl=new THREE.Group();box(pl,.12,.1,.7,mat('plane',{color:0xf4f4f4}));box(pl,.85,.02,.18,mat('plane',{}),0,.05,0);box(pl,.3,.02,.1,mat('plane',{}),0,.06,.3);pl.position.set(-S*.35+i*.38,0,-S*.08);g.add(pl);}
  }
}

function placeBuilding(t,b,instant){
  t.b=b; t.tree=false; t.zone=b.zone||null;if(b.seed==null)b.seed=Math.random()*1000;
  const sz=b.size||1;
  for(let dz=0;dz<sz;dz++)for(let dx=0;dx<sz;dx++){const n=T(t.x+dx,t.z+dz);if(n!==t){n.ref=key(t);n.tree=false;n.zone=null;drawTile(n);}}
  const k=key(t),o=objs[k]||(objs[k]={});
  if(o.b){scene.remove(o.b);if(b.zone)disposeGroup(o.b);o.b=null;}
  if(b.zone&&instant){o.baked=true;o.grow=1;}
  else{o.baked=false;o.b=buildMesh(t);scene.add(o.b);if(instant){o.grow=1;}else{o.b.scale.set(1,.01,1);o.grow=0;}}
  drawTile(t);dirty=true;
}
function rebuild(t){const o=objs[key(t)]||(objs[key(t)]={});if(t.b&&t.b.zone){if(o.b){scene.remove(o.b);disposeGroup(o.b);o.b=null;}o.baked=true;o.grow=1;markDirty(t);dirty=true;return;}if(o.b){scene.remove(o.b);}o.b=buildMesh(t);scene.add(o.b);dirty=true;}
function removeBuilding(t){
  if(t.ref!=null)t=G.tiles[t.ref];
  if(!t.b)return;
  const sz=t.b.size||1;
  for(let dz=0;dz<sz;dz++)for(let dx=0;dx<sz;dx++){const n=T(t.x+dx,t.z+dz);n.ref=null;if(n!==t)drawTile(n);}
  const o=objs[key(t)];if(o){if(o.b){scene.remove(o.b);if(t.b.zone)disposeGroup(o.b);o.b=null;}o.baked=false;}
  const z=t.b.zone; t.b=null; t.zone=z||null; drawTile(t); dirty=true;
}

/* ---------- simulation ---------- */
let dirty=true, stats={pop:0,cj:0,ij:0,hap:0,inc:0,exp:0,dR:0,dC:0,dI:0,riders:0}, cov=null;
const roots=()=>G.tiles.filter(t=>t.b);
function terminalStats(b){
  const s=SERV[b.kind], it=b.interior||[], c=id=>it.filter(v=>v===id).length;
  const plats=c('plat'),ent=c('ent'),gates=c('gate')+c('sec'),tick=c('tick');
  const flow=Math.min(1,(ent*0.5+gates*0.35+tick*0.25)/Math.max(1,plats));
  const cap=Math.round(plats*s.capPer*(0.4+0.6*flow)*(1+c('esc')*0.1));
  const comfort=clamp(30+c('seat')*6+c('wc')*10+c('info')*5+c('plant')*4+c('food')*6,0,100);
  const shops=c('shop')+c('food');
  const ok=plats>0&&ent>0;
  return {plats,ent,cap:ok?cap:0,comfort,shops,ok};
}
function computeCoverage(){
  cov=new Array(N*N).fill(0).map(()=>({}));
  for(const t of roots()){const b=t.b;if(!b.kind)continue;const s=SERV[b.kind];
    if(s.cat==='tr'&&!terminalStats(b).ok)continue;
    const c=(b.size-1)/2, cx=t.x+c, cz=t.z+c, r=s.r;
    for(let z=Math.max(0,Math.floor(cz-r));z<=Math.min(N-1,cz+r);z++)for(let x=Math.max(0,Math.floor(cx-r));x<=Math.min(N-1,cx+r);x++){
      const d=Math.hypot(x-cx,z-cz);if(d<=r){const v=cov[z*N+x];v[s.cov]=(v[s.cov]||0)+1;if(s.poll&&d<s.poll)v.poll=1;if(s.cat==='tr')v.comfort=Math.max(v.comfort||0,terminalStats(b).comfort);}
    }
    if(s.cat==='svc'&&b.kind==='power'){}
  }
  for(const t of roots())if(t.b.zone==='I'){for(let dz=-3;dz<=3;dz++)for(let dx=-3;dx<=3;dx++){const n=T(t.x+dx,t.z+dz);if(n)cov[key(n)].poll=1;}}
  dirty=false;
}
const hasRoad=t=>{for(const[dx,dz]of[[0,-1],[1,0],[0,1],[-1,0]]){const n=T(t.x+dx,t.z+dz);if(n&&n.road)return true;}return false;};
function cap(b){if(!b.zone)return 0;const area=b.fp*b.fp;return Math.round(b.floors*area*(b.zone==='R'?9:b.zone==='C'?7:12));}
function happiness(t){
  const v=cov[key(t)];let h=45;
  for(const k of['police','fire','health','edu','park','transit'])if(v[k])h+=8;
  if(!v.power)h-=25;if(!v.water)h-=25;if(v.poll&&t.b.zone==='R')h-=18;
  h+=(v.comfort||0)/10;h-=(G.tax-10)*2;
  return clamp(Math.round(h),0,100);
}
function tick(){
  if(dirty||!cov)computeCoverage();
  let pop=0,cj=0,ij=0,hs=0,hn=0,up=0,riders=0,shopInc=0;
  const rs=roots();
  for(const t of rs){const b=t.b;
    if(b.zone){b.hap=happiness(t);const c=cap(b);if(b.zone==='R')pop+=c;else if(b.zone==='C')cj+=c;else ij+=c;hs+=b.hap*c;hn+=c;}
    else{const s=SERV[b.kind];up+=s.up;if(s.cat==='tr'){const ts=terminalStats(b);b.ts=ts;shopInc+=ts.ok?ts.shops*6:0;}}
  }
  // ridership
  for(const t of rs){const b=t.b;if(!b.ts||!b.ts.ok)continue;const s=SERV[b.kind];let near=0;for(const u of rs)if(u.b.zone==='R'&&Math.hypot(u.x-t.x,u.z-t.z)<s.r)near+=cap(u.b);b.riders=Math.min(b.ts.cap,Math.round(near*0.35+(b.kind==='airport'?pop*0.05:0)));riders+=b.riders;}
  const workers=pop*0.6, jobs=cj+ij, taxF=(G.tax-10)*2.5;
  stats.dR=clamp(45+(jobs-workers)/4-taxF+(hn?(hs/hn-50)/2:0),-100,100);
  stats.dC=clamp((pop*0.28-cj)/2+riders/40-taxF+5,-100,100);
  stats.dI=clamp((pop*0.32-ij)/2+18-taxF,-100,100);
  const inc=(pop*2.2+jobs*1.4)*G.tax/10+riders*0.32+shopInc;
  stats.pop=pop;stats.cj=cj;stats.ij=ij;stats.hap=hn?Math.round(hs/hn):0;stats.inc=inc;stats.exp=up;stats.riders=riders;
  if(G.mode==='career')G.money+=(inc-up)/30;
  // growth
  const cand=G.tiles.filter(t=>t.zone&&!t.b&&t.ref==null&&!t.road);
  for(let i=0;i<4&&cand.length;i++){
    const t=cand.splice(Math.floor(Math.random()*cand.length),1)[0];
    const d=stats['d'+t.zone];const v=cov[key(t)];
    if(d>5&&v.power&&v.water&&hasRoad(t)&&Math.random()<0.5+d/200){
      const b=Object.assign({zone:t.zone,level:1,size:1,rot:faceRoad(t)},defaultBuilding(t.zone,1));placeBuilding(t,b);
    }
  }
  // upgrades
  for(const t of rs){const b=t.b;if(b.zone&&!b.custom&&b.level<3&&b.hap>62+b.level*6&&Math.random()<0.015&&stats['d'+b.zone]>-20){b.level++;Object.assign(b,defaultBuilding(b.zone,b.level));rebuild(t);}}
  G.day++;
  if(G.mode==='career'){const m=MILESTONES[G.ms+1];if(m&&pop>=m.pop){G.ms++;m.unlock.forEach(k=>G.unlocked.add(k));G.money+=m.reward||0;Snd.play('milestone');toast(`Milestone: ${m.name}! +${fmt(m.reward||0)}${m.unlock.length?' · Unlocked '+m.unlock.map(k=>SERV[k]?SERV[k].name:{C:'Commercial',I:'Industrial'}[k]||k).join(', '):''}`,4000);renderCats();}}
  if(G.day%30===0)save();
  updateHUD();

  else {const l=list.filter(t=>!t.road&&!t.water&&!t.b&&t.ref==null&&t.zone!==tool);if(!l.length||!spend(l.length*5))return;l.forEach(t=>{t.zone=tool;t.tree=false;drawTile(t);});Snd.play('zone');}

let undoSnap=null;

  const snap={roads:[],blds:[],trees:[],zones:[],cost:0};const seen=new Set();
  for(let t of list){
    const isB=t.b||t.ref!=null;
    if(isB&&mode!=='demR'){const r=t.ref!=null?G.tiles[t.ref]:t;if(seen.has(r))continue;seen.add(r);snap.blds.push({t:r,b:JSON.parse(JSON.stringify(r.b))});removeBuilding(r);snap.cost+=50;}
    else if(t.road&&mode!=='demB'){snap.roads.push(t);t.road=false;redrawAround(t);snap.cost+=5;}
    else if(mode==='bulldoze'&&t.tree){snap.trees.push(t);t.tree=false;setTree(t);snap.cost+=2;}
    else if(mode==='bulldoze'&&t.zone&&!t.b){snap.zones.push({t,z:t.zone});t.zone=null;drawTile(t);}
  }
  if(!snap.roads.length&&!snap.blds.length&&!snap.trees.length&&!snap.zones.length){toast(mode==='demR'?'No road there':mode==='demB'?'No building there':'Nothing to demolish');return;}
  if(G.mode==='career')G.money-=snap.cost;Snd.play('demolish');
  undoSnap=snap;dirty=true;
  const n=[];if(snap.blds.length)n.push(snap.blds.length+' building'+(snap.blds.length>1?'s':''));if(snap.roads.length)n.push(snap.roads.length+' road tile'+(snap.roads.length>1?'s':''));if(snap.trees.length)n.push(snap.trees.length+' tree'+(snap.trees.length>1?'s':''));

}

  s.zones.forEach(({t,z})=>{if(!t.b&&!t.road){t.zone=z;drawTile(t);}});
  s.trees.forEach(t=>{if(!t.b&&!t.road&&t.ref==null){t.tree=true;setTree(t);}});
  for(const{t,b}of s.blds){const sz=b.size||1;let ok=true;for(let dz=0;dz<sz;dz++)for(let dx=0;dx<sz;dx++){const n=T(t.x+dx,t.z+dz);if(!n||n.road||n.b||n.ref!=null)ok=false;}if(ok)placeBuilding(t,b);}

let iT=null,iTool='plat';
function autoLayout(kind){
  const s=SERV[kind],W=s.gw,H=s.gh,a=new Array(W*H).fill(null);
  const set=(x,y,v)=>{if(x>=0&&y>=0&&x<W&&y<H)a[y*W+x]=v;};
  for(let x=1;x<W-1;x+=2)set(x,0,'plat');
  for(let x=0;x<W;x++)if(!a[x])set(x,0,'seat');
  set(Math.floor(W/2),H-1,'ent');set(1,H-1,'ent');
  for(let x=2;x<W-2;x+=2)set(x,2,'gate');
  set(0,H-2,'tick');set(W-1,H-2,'info');set(W-1,H-1,'wc');set(2,H-2,'shop');set(W-3,H-2,'food');
  if(kind==='airport'){set(4,3,'sec');set(5,3,'sec');}
  for(let x=1;x<W-1;x+=3)set(x,1,'seat');
  set(0,2,'plant');set(W-1,2,'plant');
  return a;
}

/* ---------- sound: everything synthesized with Web Audio (no audio files) ---------- */
const Snd=(()=>{
  let ctx=null,master,music,sfx,amb,noiseBuf,ambSrc,ambF,ambG,birdsT=0,musicT=0,chord=0,started=false;
  const vol=(()=>{try{return JSON.parse(localStorage.getItem('metrob_vol'))||{m:.8,mu:.35,s:.7};}catch(e){return{m:.8,mu:.35,s:.7};}})();
  function save(){try{localStorage.setItem('metrob_vol',JSON.stringify(vol));}catch(e){}}
  function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{ctx=new AC();}catch(e){return;}
    master=ctx.createGain();master.connect(ctx.destination);music=ctx.createGain();sfx=ctx.createGain();amb=ctx.createGain();music.connect(master);sfx.connect(master);amb.connect(master);apply();
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuf.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
    ambSrc=ctx.createBufferSource();ambSrc.buffer=noiseBuf;ambSrc.loop=true;ambF=ctx.createBiquadFilter();ambF.type='lowpass';ambF.frequency.value=500;ambG=ctx.createGain();ambG.gain.value=0;ambSrc.connect(ambF);ambF.connect(ambG);ambG.connect(amb);ambSrc.start();started=true;}
  function apply(){if(!ctx)return;master.gain.value=vol.m;music.gain.value=vol.mu*.5;sfx.gain.value=vol.s;amb.gain.value=vol.s*.9;}
  function unlock(){init();if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});}
  function env(node,t,a,peak,dec){node.gain.setValueAtTime(0,t);node.gain.linearRampToValueAtTime(peak,t+a);node.gain.exponentialRampToValueAtTime(.0001,t+a+dec);}
  function tone(freq,type,dur,peak,dest,when=0,glide){if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);o.connect(g);g.connect(dest||sfx);env(g,t,.008,peak,dur);o.start(t);o.stop(t+dur+.05);}
  function noise(dur,peak,fq,type='bandpass',when=0,q=1){if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime+when,s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=fq;f.Q.value=q;s.connect(f);f.connect(g);g.connect(sfx);env(g,t,.005,peak,dur);s.start(t,Math.random());s.stop(t+dur+.05);}
  const fx={
    click:()=>tone(880,'triangle',.05,.06),
    build:()=>{noise(.12,.25,320,'lowpass');tone(180,'sine',.14,.18,null,0,90);},
    road:()=>{noise(.18,.18,900,'bandpass',0,.7);tone(140,'sine',.1,.1);},
    zone:()=>{tone(660,'sine',.08,.07);tone(990,'sine',.1,.05,null,.05);},
    demolish:()=>{noise(.35,.35,250,'lowpass');noise(.25,.2,1600,'bandpass',.05,.8);tone(90,'sawtooth',.2,.06,null,0,45);},
    error:()=>{tone(180,'square',.12,.05);tone(140,'square',.14,.05,null,.12);},
    milestone:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,'triangle',.35,.12,null,i*.11));},
    chime:()=>{tone(784,'sine',.25,.09);tone(1175,'sine',.35,.06,null,.08);},
    horn:()=>{tone(392,'square',.18,.025);tone(494,'square',.18,.02);},
  };
  function play(n){if(!started)return;fx[n]&&fx[n]();}
  // background music: slow generative pad
  const CH=[[220,277.2,329.6,415.3],[196,246.9,293.7,370],[174.6,220,261.6,329.6],[196,246.9,293.7,392]];
  function pad(){if(!ctx||ctx.state!=='running'||vol.mu<=0)return;const t=ctx.currentTime,c=CH[chord++%CH.length];
    for(const f of c){const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type='triangle';o.frequency.value=f/2;o.detune.value=(Math.random()-.5)*8;lp.type='lowpass';lp.frequency.value=900;
      o.connect(lp);lp.connect(g);g.connect(music);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+2.5);g.gain.linearRampToValueAtTime(.04,t+6);g.gain.linearRampToValueAtTime(0,t+9);o.start(t);o.stop(t+9.2);}
    const mel=c[Math.floor(Math.random()*4)]*2;tone(mel,'sine',2.2,.025,music,2+Math.random()*3);}
  function update(dt,info){if(!started||ctx.state!=='running')return;
    // ambience: louder when zoomed in over a busy city, quieter far away
    const near=clamp(1-(info.dist-4)/40,0,1),busy=clamp(info.cars/50,0,1);
    ambG.gain.setTargetAtTime(.02+.16*near*(.3+.7*busy),ctx.currentTime,.5);ambF.frequency.setTargetAtTime(300+900*near,ctx.currentTime,.5);
    birdsT-=dt;if(birdsT<=0){birdsT=1.5+Math.random()*4;if(near>.25){if(info.day>.5&&Math.random()<.7){const f=2200+Math.random()*1800;tone(f,'sine',.09,.02*near,amb,0,f*1.25);tone(f*1.1,'sine',.07,.016*near,amb,.12,f*.9);}
      else if(info.day<.3){for(let i=0;i<3;i++)tone(4300+Math.random()*300,'sine',.03,.01*near,amb,i*.07);}
      if(info.cars>20&&Math.random()<.08*near)fx.horn();}}
    musicT-=dt;if(musicT<=0){musicT=8.5;pad();}}
  return{unlock,play,update,vol,apply,save};
})();
addEventListener('pointerdown',()=>Snd.unlock(),{capture:true});
document.addEventListener('click',e=>{if(e.target.closest('button'))Snd.play('click');},true);

/* ---------- keyboard & desktop controls ---------- */
const keys=new Set();
function typing(e){const t=e.target;return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');}
function setTool(c,t){cat=c;tool=t;bmenu.classList.remove('open');renderCats();}
addEventListener('keydown',e=>{
  if(typing(e)||!G||!$('menu').classList.contains('hide'))return;
  const k=e.key.toLowerCase();keys.add(k);
  if(e.ctrlKey&&k==='z'){undoDemolish();e.preventDefault();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  switch(k){
    case 'q':cam.yaw+=Math.PI/4;break;case 'e':cam.yaw-=Math.PI/4;break;
    case ' ':speed=speed?0:1;$('bSpeed').textContent=speed?speed+'×':'Pause';e.preventDefault();break;
    case '1':case '2':case '3':speed=[1,2,4][+k-1];$('bSpeed').textContent=speed+'×';break;
    case 'v':setTool('view','view');break;case 'g':setTool('select','select');break;
    case 'b':openBuild();break;case 'x':setTool('demolish','bulldoze');break;case 'm':$('cMap').click();break;
    case 'escape':if($('interior').classList.contains('open'))$('iDone').click();else if(sheet.classList.contains('open')||bmenu.classList.contains('open')){sheet.classList.remove('open');bmenu.classList.remove('open');}else setTool('view','view');break;
    case 'f11':break;
  }
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
function keyCam(dt){if(!keys.size)return;const sp=cam.dist*1.1*dt;let dx=0,dz=0;
  if(keys.has('w')||keys.has('arrowup'))dz-=1;if(keys.has('s')||keys.has('arrowdown'))dz+=1;if(keys.has('a')||keys.has('arrowleft'))dx-=1;if(keys.has('d')||keys.has('arrowright'))dx+=1;
  if(dx||dz){const c=Math.cos(cam.yaw),s=Math.sin(cam.yaw);cam.tx+=(dx*c+dz*s)*sp;cam.tz+=(-dx*s+dz*c)*sp;if(follow){follow=null;$('cFollow').classList.remove('on');$('cPed').classList.remove('on');}}
  if(keys.has('r'))cam.pitch+=dt*.9;if(keys.has('f'))cam.pitch-=dt*.9;
  if(keys.has('=')||keys.has('+'))cam.dist*=1-dt*1.5;if(keys.has('-')||keys.has('_'))cam.dist*=1+dt*1.5;}

/* ---------- map overlays ---------- */
const OVL=[null,'power','water','services','happiness','pollution','transit'];
const OVN={power:['Power','Covered','No power'],water:['Water','Covered','No water'],services:['Services','All 5','None'],happiness:['Happiness','Happy','Unhappy'],pollution:['Pollution','Polluted',''],transit:['Transit','Served','']};
let ovI=0;
const ovMesh=new THREE.InstancedMesh(new THREE.PlaneGeometry(.94,.94).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({transparent:true,opacity:.55,depthWrite:false}),N*N);
ovMesh.renderOrder=3;ovMesh.frustumCulled=false;ovMesh.visible=false;scene.add(ovMesh);
const _oc=new THREE.Color(),OK_C=new THREE.Color(0x3ddc84),BAD_C=new THREE.Color(0xff5252),MID_C=new THREE.Color(0xffd23f);
function updateOverlay(){
  const mode=OVL[ovI];ovMesh.visible=!!mode&&!!G;$('legend').style.top=($('top').offsetHeight+6)+'px';$('legend').classList.toggle('show',!!mode&&!!G);$('cMap').classList.toggle('on',!!mode);
  if(!mode||!G)return;if(dirty||!cov)computeCoverage();
  const n=OVN[mode];$('legend').innerHTML=`<b>${n[0]}</b><span><i style="background:#3ddc84"></i>${n[1]}</span>${n[2]?`<span><i style="background:#ff5252"></i>${n[2]}</span>`:''}`;
  if(mode==='pollution')$('legend').innerHTML=`<b>Pollution</b><span><i style="background:#a0522d"></i>Polluted area</span>`;
  if(mode==='transit')$('legend').innerHTML=`<b>Transit</b><span><i style="background:#4fb3ff"></i>Near an open station</span>`;
  for(const t of G.tiles){const i=key(t),v=cov[i],r=t.ref!=null?G.tiles[t.ref]:t;let show=!t.water,c=null;
    if(mode==='power'||mode==='water'){c=v[mode]?OK_C:BAD_C;if(!t.zone&&!t.b&&t.ref==null&&!t.road&&!v[mode])show=false;}
    else if(mode==='services'){const k=['police','fire','health','edu','park'].filter(q=>v[q]).length;c=_oc.copy(BAD_C).lerp(MID_C,Math.min(1,k/2.5)).lerp(OK_C,Math.max(0,(k-2.5)/2.5)).clone();if(!t.zone&&!t.b&&t.ref==null)show=false;}
    else if(mode==='happiness'){if(r.b&&r.b.zone&&r.b.hap!=null){const h=r.b.hap/100;c=_oc.copy(BAD_C).lerp(MID_C,Math.min(1,h*2)).lerp(OK_C,Math.max(0,h*2-1)).clone();}else show=false;}
    else if(mode==='pollution'){if(v.poll)c=new THREE.Color(0xa0522d);else show=false;}
    else if(mode==='transit'){if(v.transit)c=new THREE.Color(0x4fb3ff);else show=false;}
    if(show&&c){dummy.position.set(wx(t.x),(r.b&&r.b.zone)?.02:.025,wx(t.z));dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);ovMesh.setColorAt(i,c);}else{dummy.position.set(0,-50,0);dummy.scale.set(.001,.001,.001);}
    dummy.updateMatrix();ovMesh.setMatrixAt(i,dummy.matrix);}
  ovMesh.instanceMatrix.needsUpdate=true;if(ovMesh.instanceColor)ovMesh.instanceColor.needsUpdate=true;
}
$('cMap').onclick=()=>{ovI=(ovI+1)%OVL.length;updateOverlay();if(OVL[ovI])toast('Map: '+OVN[OVL[ovI]][0]+' · tap Map again for the next view');};
$('bDem').onclick=()=>toast(`Demand · Homes ${Math.round(stats.dR)} · Shops ${Math.round(stats.dC)} · Industry ${Math.round(stats.dI)}. Zone more of the tallest bar.`,4000);

/* ---------- tutorial ---------- */
const TUT=[
  {t:'Build a road',x:'Tap Build, open Roads, then drag on the map. Buildings only grow next to roads.',hl:'build',ok:()=>G.tiles.filter(t=>t.road).length>=tutBase+4},
  {t:'Zone homes',x:'In Build → Zones pick Residential and drag an area beside your road.',hl:'build',ok:()=>G.tiles.filter(t=>t.zone==='R').length>=6},
  {t:'Turn on the power',x:'Build → Utilities → Power plant. It powers every building within 16 tiles.',hl:'build',ok:()=>G.tiles.some(t=>t.b&&(t.b.kind==='power'||t.b.kind==='solar'))},
  {t:'Add water',x:'Build → Utilities → Water tower near your homes.',hl:'build',ok:()=>G.tiles.some(t=>t.b&&t.b.kind==='water')},
  {t:'Watch it grow',x:'Homes appear when power and water reach them. Tap 1× to speed up time, and Map to check coverage.',hl:'bSpeed',ok:()=>stats.pop>=30},
  {t:'Make it yours',x:'Tap Edit, then any building to rename it, change floors, roof and colour. Transit terminals let you design the inside.',hl:'select',ok:null},
];
let tutI=-1,tutBase=0;
function tutDone(){try{return localStorage.getItem('metrob_tut')==='done';}catch(e){return false;}}
function startTut(force){if(!force&&tutDone())return;tutBase=G.tiles.filter(t=>t.road).length;tutI=0;showTut();}
function endTut(){tutI=-1;$('tut').classList.remove('show');document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('pulse'));try{localStorage.setItem('metrob_tut','done');}catch(e){}}
function showTut(){const st=TUT[tutI];if(!st){endTut();return;}
  $('tStep').textContent=`Step ${tutI+1} of ${TUT.length}`;$('tTitle').textContent=st.t;$('tText').textContent=st.x;$('tNext').style.display=st.ok?'none':'';$('tNext').textContent=tutI===TUT.length-1?'Finish':'Next';
  $('tut').classList.add('show');document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('pulse'));
  const el=st.hl==='bSpeed'?$('bSpeed'):document.querySelector(`[data-c="${st.hl}"]`);if(el)el.classList.add('pulse');}
function tutCheck(){if(tutI<0||!G)return;const st=TUT[tutI];if(st.ok&&st.ok()){tutI++;if(tutI<TUT.length){toast('Nice! Step done.');Snd.play('chime');showTut();}else endTut();}}
$('tSkip').onclick=endTut;$('tNext').onclick=()=>{tutI++;showTut();};

/* ---------- alerts ---------- */
let alertT=0;
function cityAlerts(){if(!G||tutI>=0)return;alertT++;if(alertT%12)return;
  const bs=G.tiles.filter(t=>t.b&&t.b.zone);if(!bs.length)return;let np=0,nw=0;for(const t of bs){const v=cov[key(t)];if(!v.power)np++;if(!v.water)nw++;}
  if(G.mode==='career'&&G.money<0)toast('You are in debt. Raise taxes in Budget or remove costly services.',4500);
  else if(G.mode==='career'&&G.money<3000&&stats.inc<stats.exp)toast('Money is running low: spending is higher than income.',4000);
  else if(np>2)toast(`${np} buildings have no power. Add a power plant nearby (Map shows coverage).`,4000);
  else if(nw>2)toast(`${nw} buildings have no water. Add a water tower nearby.`,4000);
  else if(stats.dR>60&&!G.tiles.some(t=>t.zone==='R'&&!t.b&&t.ref==null))toast('People want to move in: zone more Residential.',3500);
}

/* ---------- HUD ---------- */
let speed=1;
$('bSpeed').onclick=()=>{speed=speed===1?2:speed===2?4:speed===4?0:1;$('bSpeed').textContent=speed?speed+'×':'Pause';};
$('bMenu').onclick=openBudget;
function updateHUD(){
  if(!G)return;
  $('sMoney').textContent=G.mode==='sandbox'?'Unlimited':fmt(G.money);$('sMoney').style.color=G.money<0?'var(--bad)':'';
  $('sInc').textContent=(stats.inc-stats.exp>=0?'+':'')+fmt(stats.inc-stats.exp)+'/mo';
  $('sPop').textContent=stats.pop.toLocaleString();$('sHap').textContent=stats.pop?stats.hap+'%':'–';
  for(const k of['R','C','I']){const v=stats['d'+k];const el=$('d'+k);el.style.height=Math.max(2,Math.abs(v)*.3)+'px';el.style.opacity=v<0?.35:1;}
  $('sDate').textContent=MONTHS[Math.floor(G.day/30)%12]+' Y'+(1+Math.floor(G.day/360));
  $('sMode').textContent=(G.mode==='sandbox'?'Sandbox':(MILESTONES[G.ms].name))+' · '+clockStr();
  const nx=MILESTONES[G.ms+1];
  $('goal').innerHTML=G.mode==='career'&&nx?`Next: <b>${nx.name}</b> at ${nx.pop.toLocaleString()} citizens (${Math.min(100,Math.round(stats.pop/nx.pop*100))}%)`:'';
}
function clockStr(){const m=Math.floor(clock*1440),h=Math.floor(m/60)%24,mm=String(m%60).padStart(2,'0');return (h%12||12)+':'+mm+(h<12?' AM':' PM');}
let toastT;function toast(m,ms=2200){const e=$('toast');e.style.top=($('top').offsetHeight+(OVL[ovI]?60:10))+'px';e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),ms);}

/* ---------- save/load ---------- */
function save(){try{if(!G)return;localStorage.setItem('metrob',JSON.stringify({mode:G.mode,money:G.money,day:G.day,tax:G.tax,ms:G.ms,unlocked:[...G.unlocked],tiles:G.tiles.map(t=>[t.water?1:0,t.road?1:0,t.zone||0,t.tree?1:0,t.ref??-1,t.b||0])}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('metrob'));if(!d)return false;
  G={mode:d.mode,money:d.money,day:d.day,tax:d.tax,ms:d.ms,unlocked:new Set(d.unlocked),tiles:d.tiles.map((a,i)=>({x:i%N,z:Math.floor(i/N),water:!!a[0],road:!!a[1],zone:a[2]||null,tree:!!a[3],ref:a[4]<0?null:a[4],b:null,_b:a[5]||null}))};return true;}catch(e){return false;}}
function clearScene(){for(const k in objs){const o=objs[k];['road','zone','b'].forEach(p=>{if(o[p])scene.remove(o[p]);});delete objs[k];}for(const C of chunks){for(const m of C.meshes){scene.remove(m);m.geometry.dispose();}C.meshes=[];C.dirty=true;}}
function buildWorld(){lampsDirty=true;tlDirty=true;
  clearScene();
  const wt=G.tiles.filter(t=>t.water);
  if(waterMesh)scene.remove(waterMesh);
  waterMesh=new THREE.InstancedMesh(tileGeo,new THREE.MeshStandardMaterial({color:0x3f8fb5,roughness:.15,metalness:.4,transparent:true,opacity:.92}),wt.length);
  wt.forEach((t,i)=>{dummy.position.set(wx(t.x),.005,wx(t.z));dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);dummy.updateMatrix();waterMesh.setMatrixAt(i,dummy.matrix);});
  waterMesh.receiveShadow=true;scene.add(waterMesh);
  G.tiles.forEach(drawTile);
  G.tiles.forEach(t=>{if(t._b){const b=t._b;delete t._b;placeBuilding(t,b,true);}});flushChunks(999);rebuildTrees();
  dirty=true;tick();
}
function showMenu(){
  $('menu').classList.remove('hide');
  let has=false;try{const d=localStorage.getItem('metrob');if(d){const j=JSON.parse(d);has=true;$('mContInfo').textContent=(j.mode==='sandbox'?'Sandbox':'Career')+' · '+MONTHS[Math.floor(j.day/30)%12]+' Y'+(1+Math.floor(j.day/360));}}catch(e){}
  $('mCont').style.display=has?'block':'none';
}
function start(mode){if(mode)newGame(mode);else if(!load())newGame('sandbox');$('menu').classList.add('hide');cat='view';tool='view';renderCats();buildWorld();cam.tx=0;cam.tz=0;
  ovI=0;updateOverlay();endTutSilently();
  if(mode&&!tutDone())startTut();
  else if(mode==='career')toast('Career: build roads, zone Residential, then add a power plant and water tower',5000);
  else if(mode)toast('Sandbox: everything unlocked, unlimited money',3500);}
function endTutSilently(){tutI=-1;$('tut').classList.remove('show');document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('pulse'));}
$('mSand').onclick=()=>start('sandbox');$('mCareer').onclick=()=>start('career');$('mCont').onclick=()=>start(null);
let hiGfx=true;$('mGfx').onclick=()=>{hiGfx=!hiGfx;renderer.shadowMap.enabled=hiGfx;sun.castShadow=hiGfx;renderer.setPixelRatio(hiGfx?Math.min(devicePixelRatio,1.75):1);perfLvl=0;Object.values(M).forEach(m=>m.needsUpdate=true);$('mGfx').firstChild.textContent='Graphics: '+(hiGfx?'High':'Low');resize();};

/* ---------- loop ---------- */
let hudT=0,clockMode=(()=>{try{return localStorage.getItem('metrob_clock')||'device';}catch(e){return'device';}})(),clock=.35,last=performance.now(),acc=0;
const skyDay=new THREE.Color(0xa9d3ec),skyNight=new THREE.Color(0x0b1430),skyDusk=new THREE.Color(0xf2a36b),sky=new THREE.Color();
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(G&&$('menu').classList.contains('hide')){
    acc+=dt*speed;if(acc>=1){acc=0;tick();}
    hudT-=dt;if(hudT<=0){hudT=1;updateHUD();}
    updateCars(dt*Math.max(speed,.0001)*(speed?1:0));updatePeople(speed?dt*Math.min(speed,2):0,dt);perfTune(dt);
    for(const k in objs){const o=objs[k];if(o.b&&o.grow<1){o.grow=Math.min(1,(o.grow||0)+dt*2);o.b.scale.y=1-Math.pow(1-o.grow,3);if(o.grow>=1){const t=G.tiles[k];if(t.b&&t.b.zone){o.baked=true;markDirty(t);}}}}
  }
  if(clockMode==='device'){const d=new Date();clock=(d.getHours()+d.getMinutes()/60+d.getSeconds()/3600)/24;}else if(clockMode==='day')clock=.4;else if(clockMode==='cycle')clock=(clock+dt*Math.max(speed,.5)/180)%1;
  const ang=clock*Math.PI*2-Math.PI/2, el=Math.sin(ang);
  const dayF=clamp(el*3+.3,0,1);
  sun.position.set(Math.cos(ang)*40+cam.tx,Math.max(5,el*45),18+cam.tz);sun.target.position.set(cam.tx,0,cam.tz);
  sun.intensity=.15+dayF*.95;hemi.intensity=.25+dayF*.55;
  sky.copy(skyNight).lerp(skyDay,dayF);if(dayF>0&&dayF<.7)sky.lerp(skyDusk,(1-Math.abs(dayF-.35)/.35)*.45);
  scene.background=sky;scene.fog.color.copy(sky);
  const nightI=clamp(1-dayF*1.4,0,1)*1.3;for(const m of winMats)m.emissiveIntensity=nightI;updateLights(dt,dayF,.12+dayF*.9);
  keyCam(dt);Snd.update(dt,{dist:cam.dist,cars:G?Math.min(CARS,Math.floor(10+stats.pop/22)):12,day:dayF});
  if(treeDirty)rebuildTrees();flushChunks(G?2:8);applyCam();renderer.render(scene,camera);
requestAnimationFrame(loop);
}
// menu backdrop city
newGame('sandbox');G.tiles.forEach((t,i)=>{});
buildWorld();
(function demo(){const z0=Math.floor(N/2);for(let x=8;x<30;x++)for(let z=z0-6;z<z0+6;z++){const t=T(x,z);if(t.road)continue;if((x%5===0)){t.road=true;t.tree=false;redrawAround(t);continue;}if(Math.random()<.7){const zone=Math.abs(z-z0)<3?'C':'R';const lv=1+Math.floor(Math.random()*3);placeBuilding(t,Object.assign({zone,level:lv,size:1,rot:faceRoad(t)},defaultBuilding(zone,lv)),true);}}cam.tx=-4;cam.dist=26;flushChunks(999);rebuildTrees();})();
G=null;
showMenu();renderCats&&0;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G)save();});addEventListener('pagehide',()=>{if(G)save();});
window.MB={VT:VTYPES,setClock:(m,v)=>{clockMode=m;if(v!=null)clock=v;},get G(){return G},T,placeService:(k,x,z)=>{tool=k;placeService(T(x,z));tool='view';},zone:(k,x0,z0,x1,z1)=>{tool=k;const l=[];for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++)l.push(T(x,z));commit(l);tool='view';}};
requestAnimationFrame(loop);
}
