let undoSnap=null;
function demolish(list,mode){

    else if((t.rail||t.metro||t.runway||t.buslane||t.xw||t.xo||t.bs)&&mode!=='demB'){snap.nets.push({t,f:[t.rail,t.metro,t.runway,t.buslane,t.xw,t.xo,t.bs]});t.rail=t.metro=t.runway=t.buslane=false;t.xw=false;t.xo=null;t.bs=false;redrawAround(t);netT=0;snap.cost+=5;}

    else if(mode==='bulldoze'&&t.tree){snap.trees.push(t);t.tree=false;setTree(t);snap.cost+=2;}
    else if(mode==='bulldoze'&&t.zone&&!t.b){snap.zones.push({t,z:t.zone});t.zone=null;drawTile(t);}
  }
  if(!snap.curves&&!snap.roads.length&&!snap.blds.length&&!snap.trees.length&&!snap.zones.length&&!snap.nets.length){toast(mode==='demR'?'No road there':mode==='demB'?'No building there':'Nothing to demolish');return;}
  if(G.mode==='career')G.money-=snap.cost;Snd.play('demolish');
  undoSnap=snap;dirty=true;
  const n=[];if(snap.blds.length)n.push(snap.blds.length+' building'+(snap.blds.length>1?'s':''));if(snap.curves)n.push(snap.curves+' curved road'+(snap.curves>1?'s':''));if(snap.roads.length)n.push(snap.roads.length+' road tile'+(snap.roads.length>1?'s':''));if(snap.nets.length)n.push(snap.nets.length+' track/lane tile'+(snap.nets.length>1?'s':''));if(snap.trees.length)n.push(snap.trees.length+' tree'+(snap.trees.length>1?'s':''));

}
function undoDemolish(){

const Snd=(()=>{

    road:()=>{noise(.18,.18,900,'bandpass',0,.7);tone(140,'sine',.1,.1);},
    zone:()=>{tone(660,'sine',.08,.07);tone(990,'sine',.1,.05,null,.05);},
    demolish:()=>{noise(.35,.35,250,'lowpass');noise(.25,.2,1600,'bandpass',.05,.8);tone(90,'sawtooth',.2,.06,null,0,45);},
    error:()=>{tone(180,'square',.12,.05);tone(140,'square',.14,.05,null,.12);},
    milestone:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,'triangle',.35,.12,null,i*.11));},
